name: Browser checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: browser-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Static and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js for the CI harness
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Show browser version
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null; then
            google-chrome-stable --version
          elif command -v chromium >/dev/null; then
            chromium --version
          else
            echo "Chrome or Chromium is required" >&2
            exit 1
          fi

      - name: Run static checks
        run: node tests/static-checks.mjs

      - name: Run browser tests
        run: node tests/run-browser-tests.mjs
