name: HJ Bookmarks CI and release

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-package-publish-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Static and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      package-name: ${{ steps.package.outputs.package-name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js for the CI harness
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Show browser version
        shell: bash
        run: |
          if command -v google-chrome >/dev/null; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null; then
            google-chrome-stable --version
          elif command -v chromium >/dev/null; then
            chromium --version
          else
            echo "Chrome or Chromium is required" >&2
            exit 1
          fi

      - name: Run static checks
        run: node tests/static-checks.mjs

      - name: Run browser tests
        run: node tests/run-browser-tests.mjs

      - name: Prepare portable package
        id: package
        shell: bash
        run: |
          PACKAGE_NAME="${GITHUB_REPOSITORY#*/}-portable"
          node scripts/prepare-static-package.mjs "dist/${PACKAGE_NAME}"
          node tests/run-browser-tests.mjs "dist/${PACKAGE_NAME}/tests/index.html"
          (
            cd dist
            python3 -m zipfile -c "${PACKAGE_NAME}.zip" "${PACKAGE_NAME}"
            sha256sum "${PACKAGE_NAME}.zip" > "${PACKAGE_NAME}.zip.sha256"
          )
          echo "package-name=${PACKAGE_NAME}" >> "${GITHUB_OUTPUT}"

      - name: Upload portable package artifact
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ github.sha }}
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Deploy GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js for packaging
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Prepare static site
        run: node scripts/prepare-static-package.mjs dist/site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  release:
    name: Attach portable package to release
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write

    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download tested portable package
        uses: actions/download-artifact@v8
        with:
          name: portable-${{ github.sha }}
          path: release

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ needs.test.outputs.package-name }}
        run: |
          RELEASE_FLAGS=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            RELEASE_FLAGS+=(--prerelease)
          fi
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "release/${PACKAGE_NAME}.zip" \
              "release/${PACKAGE_NAME}.zip.sha256" \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "release/${PACKAGE_NAME}.zip" \
              "release/${PACKAGE_NAME}.zip.sha256" \
              --verify-tag \
              --generate-notes \
              --title "${GITHUB_REF_NAME}" \
              "${RELEASE_FLAGS[@]}"
          fi
