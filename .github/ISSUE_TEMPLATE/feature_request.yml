name: Feature request / 功能建议
description: Suggest an improvement for HJ Bookmarks / 提议产品改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        请先描述需要解决的问题，再说明建议方案。HJ Bookmarks 必须继续支持纯静态部署和直接通过 `file://` 打开。
        Describe the problem before the solution. HJ Bookmarks must remain static-hostable and directly usable through `file://`.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting / 提交前
      options:
        - label: I searched existing issues and did not find the same request. / 我已搜索现有 Issue。
          required: true
        - label: I did not include credentials, passphrases, tokens, or private bookmarks. / 我没有提交秘密或私人书签。
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve / 要解决的问题
      description: Who encounters this problem, and in what workflow?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior / 建议行为
      description: Describe the user-visible result rather than only an implementation.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered / 已考虑的替代方案

  - type: dropdown
    id: data-impact
    attributes:
      label: Data or sync impact / 数据或同步影响
      options:
        - No data-format or sync change
        - Local data behavior changes
        - Backup format changes
        - Sync protocol or shared-library behavior changes
        - Unsure
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context / 补充信息
      description: Optional mockups or examples using synthetic data only.
