<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Bookmark Manager · Browser Tests</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        globalThis.BOOKMARK_TEST_DB_NAME = `BookmarkDB_browser_tests_${Date.now()}`;
    </script>
    <script src="../js/core/translations.js?v=20260829-17" defer></script>
    <script src="../js/core/config.js?v=20260829-17" defer></script>
    <script src="../js/core/coordination.js?v=20260829-17" defer></script>
    <script src="../js/core/storage.js?v=20260829-17" defer></script>
    <script src="../js/core/utils.js?v=20260829-17" defer></script>
    <script src="../js/sync/backup.js?v=20260829-17" defer></script>
    <script src="../js/sync/local-folder.js?v=20260829-17" defer></script>
    <script src="../js/sync/coordinator.js?v=20260829-17" defer></script>
    <script src="../js/sync/providers.js?v=20260829-17" defer></script>
    <script src="../js/sync/crypto.js?v=20260829-17" defer></script>
    <script src="../js/sync/merge.js?v=20260829-17" defer></script>
    <script src="../js/data/transfer.js?v=20260829-17" defer></script>
    <script src="test-runner.js?v=20260829-17" defer></script>
</head>
<body>
    <main class="test-shell">
        <header>
            <p class="eyebrow">ZERO-DEPENDENCY TEST SUITE</p>
            <h1>书签管理器浏览器测试</h1>
            <p>直接在浏览器中验证存储、导入、加密和冲突合并。测试数据库与正式数据隔离。</p>
        </header>

        <section class="summary" aria-live="polite">
            <div><strong id="passed-count">0</strong><span>通过</span></div>
            <div><strong id="failed-count">0</strong><span>失败</span></div>
            <div><strong id="total-count">0</strong><span>总计</span></div>
            <button id="rerun-button" type="button">重新运行</button>
        </section>

        <section class="test-list" id="test-list" aria-label="测试结果">
            <p class="running">正在运行测试…</p>
        </section>

        <footer>
            <span id="test-database-name"></span>
            <span>不需要 Node.js 或测试框架</span>
        </footer>
    </main>
</body>
</html>
