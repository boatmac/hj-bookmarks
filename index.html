<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="无需安装、数据留在本地的纯前端书签管理器。" data-i18n-content="metaDescription">
    <meta name="theme-color" content="#eef0e9">
    <title>书签库 · 本地书签管理器</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23235f43'/%3E%3Cpath d='M21 15.5A4.5 4.5 0 0 1 25.5 11h13a4.5 4.5 0 0 1 4.5 4.5V51L32 43.5 21 51V15.5Z' fill='white'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>
<body>
    <svg class="icon-sprite" aria-hidden="true">
        <symbol id="icon-bookmark" viewBox="0 0 24 24"><path d="M6.5 4.75A2.25 2.25 0 0 1 8.75 2.5h6.5a2.25 2.25 0 0 1 2.25 2.25v16.1l-5.5-3.48-5.5 3.48V4.75Z"/></symbol>
        <symbol id="icon-check" viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 6.9"/></symbol>
        <symbol id="icon-chevron-down" viewBox="0 0 24 24"><path d="m7 9.5 5 5 5-5"/></symbol>
        <symbol id="icon-chevron-right" viewBox="0 0 24 24"><path d="m9.5 7 5 5-5 5"/></symbol>
        <symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v6c0 1.66 3.58 3 8 3s8-1.34 8-3V5M4 11v6c0 1.66 3.58 3 8 3s8-1.34 8-3v-6"/></symbol>
        <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12m-4.5-4.5L12 15l4.5-4.5M4 20h16"/></symbol>
        <symbol id="icon-edit" viewBox="0 0 24 24"><path d="m14.5 5.5 4 4M4 20h4L18.7 9.3a2.83 2.83 0 0 0-4-4L4 16v4Z"/></symbol>
        <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 4h6v6m0-6-9 9m7 0v5a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/></symbol>
        <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H10l2 2.5h6.5A2.5 2.5 0 0 1 21 9v8.5a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17.5v-11Z"/></symbol>
        <symbol id="icon-folder-plus" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Zm9 4v6m-3-3h6"/></symbol>
        <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></symbol>
        <symbol id="icon-language" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14.7 14.7 0 0 1 0 18M12 3a14.7 14.7 0 0 0 0 18"/></symbol>
        <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
        <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 15.1A8.5 8.5 0 0 1 8.9 3.5 8.5 8.5 0 1 0 20.5 15.1Z"/></symbol>
        <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
        <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.2 4.2"/></symbol>
        <symbol id="icon-star" viewBox="0 0 24 24"><path d="m12 3.5 2.65 5.37 5.93.86-4.29 4.18 1.01 5.9L12 17.03 6.7 19.81l1.01-5.9-4.29-4.18 5.93-.86L12 3.5Z"/></symbol>
        <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></symbol>
        <symbol id="icon-tag" viewBox="0 0 24 24"><path d="M20 13 13 20l-9-9V4h7l9 9Z"/><circle cx="8.5" cy="8.5" r="1.2"/></symbol>
        <symbol id="icon-trash" viewBox="0 0 24 24"><path d="M4 7h16M9 3h6l1 4H8l1-4Zm-2.5 4 .8 14h9.4l.8-14M10 11v6m4-6v6"/></symbol>
        <symbol id="icon-upload" viewBox="0 0 24 24"><path d="M12 16V4M7.5 8.5 12 4l4.5 4.5M4 20h16"/></symbol>
        <symbol id="icon-x" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    </svg>

    <div class="app-shell" id="app">
        <aside class="sidebar" id="sidebar" aria-label="侧边栏" data-i18n-aria-label="sidebarLabel">
            <button class="brand" id="brand-button" type="button">
                <span class="brand-mark"><svg><use href="#icon-bookmark"></use></svg></span>
                <span class="brand-copy"><strong data-i18n="brandName">书签库</strong><small data-i18n="brandSubtitle">本地书签</small></span>
            </button>

            <nav class="primary-nav" aria-label="主要视图" data-i18n-aria-label="primaryViewsLabel">
                <button class="nav-item active root-drop-target" id="all-view-button" type="button">
                    <svg><use href="#icon-grid"></use></svg><span data-i18n="allBookmarks">全部书签</span><span class="nav-count" id="all-count">0</span>
                </button>
                <button class="nav-item" id="favorites-view-button" type="button">
                    <svg><use href="#icon-star"></use></svg><span data-i18n="favorites">我的收藏</span><span class="nav-count" id="favorites-count">0</span>
                </button>
            </nav>

            <section class="sidebar-section folders-section" aria-labelledby="folders-title">
                <div class="sidebar-section-title">
                    <span id="folders-title" data-i18n="folders">文件夹</span>
                    <button class="mini-icon-button" id="sidebar-add-folder" type="button" title="新建文件夹" aria-label="新建文件夹" data-i18n-title="newFolder" data-i18n-aria-label="newFolder">
                        <svg><use href="#icon-plus"></use></svg>
                    </button>
                </div>
                <div class="folder-tree" id="folder-tree"></div>
            </section>

            <section class="sidebar-section tags-section" aria-labelledby="tags-title">
                <div class="sidebar-section-title"><span id="tags-title" data-i18n="tags">标签</span><span id="tags-count">0</span></div>
                <div class="tag-navigation" id="tag-navigation"></div>
            </section>

            <footer class="sidebar-footer">
                <div class="storage-note" title="书签数据保存在当前浏览器的 IndexedDB 中" data-i18n-title="storageTooltip">
                    <span class="status-dot"></span>
                    <span><strong data-i18n="localOnly">仅存储在此设备</strong><small id="storage-status">正在连接本地数据库…</small></span>
                </div>
                <div class="sidebar-preferences">
                    <label class="language-picker" title="界面语言" data-i18n-title="languageTitle">
                        <svg><use href="#icon-language"></use></svg>
                        <select id="language-select" aria-label="界面语言" data-i18n-aria-label="languageTitle">
                            <option value="zh">中文</option>
                            <option value="en">English</option>
                        </select>
                        <svg class="language-chevron"><use href="#icon-chevron-down"></use></svg>
                    </label>
                    <button class="theme-button" id="theme-button" type="button" aria-label="切换显示主题" title="切换显示主题" data-i18n-aria-label="themeToggle" data-i18n-title="themeToggle">
                        <svg class="theme-moon"><use href="#icon-moon"></use></svg>
                        <svg class="theme-sun"><use href="#icon-sun"></use></svg>
                    </button>
                </div>
            </footer>
        </aside>

        <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="关闭侧边栏" data-i18n-aria-label="closeSidebar"></button>

        <main class="main-area">
            <header class="topbar">
                <button class="mobile-menu-button" id="mobile-menu-button" type="button" aria-label="打开侧边栏" data-i18n-aria-label="openSidebar">
                    <svg><use href="#icon-menu"></use></svg>
                </button>

                <label class="search-box">
                    <svg><use href="#icon-search"></use></svg>
                    <span class="sr-only" data-i18n="searchBookmarks">搜索书签</span>
                    <input id="search-input" type="search" placeholder="搜索标题、网址、描述或标签……" autocomplete="off" data-i18n-placeholder="searchPlaceholder">
                    <button class="clear-search hidden" id="clear-search-button" type="button" aria-label="清除搜索" data-i18n-aria-label="clearSearch">
                        <svg><use href="#icon-x"></use></svg>
                    </button>
                    <kbd id="search-shortcut">Ctrl K</kbd>
                </label>

                <div class="topbar-actions">
                    <input id="import-file-input" type="file" accept=".json,.html,.htm,application/json,text/html" hidden>
                    <button class="button button-quiet topbar-secondary" id="import-button" type="button" title="合并导入 JSON 或浏览器书签 HTML" data-i18n-title="importTooltip">
                        <svg><use href="#icon-upload"></use></svg><span data-i18n="import">导入</span>
                    </button>

                    <details class="export-menu" id="export-menu">
                        <summary class="button button-quiet topbar-secondary" title="导出备份" data-i18n-title="exportTooltip">
                            <svg><use href="#icon-download"></use></svg><span data-i18n="export">导出</span>
                        </summary>
                        <div class="export-popover">
                            <button class="backup-menu-item" id="backup-settings-button" type="button"><strong data-i18n="automaticBackup">自动本地备份</strong><small id="backup-menu-status">尚未设置</small></button>
                            <hr>
                            <button id="export-json-button" type="button"><strong data-i18n="jsonBackup">JSON 备份</strong><small data-i18n="jsonBackupDescription">保留全部应用数据</small></button>
                            <button id="export-html-button" type="button"><strong data-i18n="browserHtml">浏览器 HTML</strong><small data-i18n="browserHtmlDescription">可导入其他浏览器</small></button>
                            <hr>
                            <button class="danger-menu-item" id="clear-all-button" type="button"><strong data-i18n="clearAll">清空全部数据</strong><small data-i18n="irreversible">此操作无法撤销</small></button>
                        </div>
                    </details>

                    <button class="button button-primary add-button" id="add-bookmark-button" type="button">
                        <svg><use href="#icon-plus"></use></svg><span data-i18n="addBookmark">添加书签</span>
                    </button>
                </div>
            </header>

            <section class="content">
                <nav class="breadcrumbs hidden" id="breadcrumbs" aria-label="文件夹路径" data-i18n-aria-label="folderPathLabel"></nav>

                <div class="page-heading">
                    <div>
                        <p class="eyebrow" id="page-eyebrow" data-i18n="eyebrowAll">个人收藏库</p>
                        <h1 id="page-title" data-i18n="allBookmarks">全部书签</h1>
                        <p class="heading-description" id="page-description" data-i18n="allDescription">把散落在各处的好内容，整理成自己的知识入口。</p>
                    </div>
                    <div class="heading-side">
                        <div class="collection-stat"><strong id="result-count">00</strong><span><span data-i18n="itemsLabel">项目</span><br><span data-i18n="foundLabel">找到</span></span></div>
                        <button class="button button-secondary" id="add-folder-button" type="button">
                            <svg><use href="#icon-folder-plus"></use></svg><span data-i18n="newFolder">新建文件夹</span>
                        </button>
                    </div>
                </div>

                <div class="results-toolbar">
                    <p id="results-label" data-i18n="initialResults">显示 0 条书签</p>
                    <label class="sort-control">
                        <span data-i18n="sort">排序</span>
                        <select id="sort-select" data-i18n-aria-label="sort">
                            <option value="newest" data-i18n="newest">最近添加</option>
                            <option value="oldest" data-i18n="oldest">最早添加</option>
                            <option value="title" data-i18n="sortByTitle">按标题</option>
                        </select>
                        <svg><use href="#icon-chevron-down"></use></svg>
                    </label>
                </div>

                <section class="folder-grid hidden" id="folder-grid" aria-label="文件夹" data-i18n-aria-label="folders"></section>
                <section class="bookmark-grid" id="bookmark-grid" aria-label="书签" data-i18n-aria-label="bookmarksLabel"></section>

                <section class="empty-state hidden" id="empty-state">
                    <span class="empty-icon"><svg><use id="empty-icon-use" href="#icon-bookmark"></use></svg></span>
                    <h2 id="empty-title" data-i18n="emptyFirstTitle">从第一条书签开始</h2>
                    <p id="empty-description" data-i18n="emptyFirstDescription">所有数据只保存在你的浏览器中。</p>
                    <button class="button button-primary" id="empty-action-button" type="button">
                        <svg><use id="empty-action-icon" href="#icon-plus"></use></svg><span id="empty-action-label" data-i18n="addBookmark">添加书签</span>
                    </button>
                </section>
            </section>
        </main>
    </div>

    <dialog class="item-dialog" id="item-dialog">
        <form class="dialog-panel" id="item-form" novalidate>
            <input type="hidden" id="item-id">
            <input type="hidden" id="item-kind">
            <header class="dialog-header">
                <div><p class="eyebrow" id="dialog-eyebrow" data-i18n="eyebrowAddBookmark">新建书签</p><h2 id="dialog-title">添加新书签</h2></div>
                <button class="icon-button dialog-close" id="dialog-close-button" type="button" aria-label="关闭" data-i18n-aria-label="close">
                    <svg><use href="#icon-x"></use></svg>
                </button>
            </header>

            <div class="dialog-fields">
                <label class="field">
                    <span><span data-i18n="fieldTitle">标题</span> <b aria-hidden="true">*</b></span>
                    <input id="item-title-input" type="text" maxlength="100" placeholder="例如：设计灵感合集" autocomplete="off" required data-i18n-placeholder="titlePlaceholder">
                </label>

                <label class="field bookmark-only-field" id="url-field">
                    <span><span data-i18n="fieldUrl">链接</span> <b aria-hidden="true">*</b></span>
                    <input id="item-url-input" type="text" inputmode="url" placeholder="example.com" autocomplete="off">
                    <small data-i18n="urlHint">可以省略 https://；仅允许常规网页及本地文件链接</small>
                </label>

                <label class="field bookmark-only-field">
                    <span data-i18n="fieldDescription">描述</span>
                    <textarea id="item-description-input" maxlength="300" rows="3" placeholder="写下一句备注，方便以后找到它……" data-i18n-placeholder="descriptionPlaceholder"></textarea>
                </label>

                <label class="field">
                    <span data-i18n="parentFolder">上级文件夹</span>
                    <select id="item-parent-select"><option value="root">/ 根目录</option></select>
                </label>

                <label class="field bookmark-only-field">
                    <span data-i18n="fieldTags">标签</span>
                    <input id="item-tags-input" type="text" maxlength="240" placeholder="设计, 工具, 稍后阅读" autocomplete="off" data-i18n-placeholder="tagsPlaceholder">
                    <small data-i18n="tagsHint">用逗号分隔多个标签</small>
                </label>

                <label class="favorite-toggle bookmark-only-field">
                    <input id="item-favorite-input" type="checkbox">
                    <span class="toggle-box"><svg><use href="#icon-check"></use></svg></span>
                    <span><strong data-i18n="addFavorite">加入收藏</strong><small data-i18n="favoriteHint">在收藏视图中快速访问</small></span>
                </label>

                <p class="form-error hidden" id="form-error" role="alert"></p>
            </div>

            <footer class="dialog-footer">
                <button class="button button-secondary" id="dialog-cancel-button" type="button" data-i18n="cancel">取消</button>
                <button class="button button-primary" id="dialog-submit-button" type="submit" data-i18n="addBookmark">添加书签</button>
            </footer>
        </form>
    </dialog>

    <dialog class="item-dialog backup-dialog" id="backup-dialog">
        <div class="dialog-panel">
            <header class="dialog-header">
                <div><p class="eyebrow" data-i18n="backupEyebrow">数据保护</p><h2 id="backup-dialog-title" data-i18n="backupSettings">自动备份设置</h2></div>
                <button class="icon-button dialog-close" id="backup-dialog-close-button" type="button" aria-label="关闭" data-i18n-aria-label="close">
                    <svg><use href="#icon-x"></use></svg>
                </button>
            </header>

            <div class="backup-settings-content">
                <section class="backup-status-card" id="backup-status-card" aria-live="polite">
                    <span class="backup-status-icon"><svg><use href="#icon-database"></use></svg></span>
                    <span><strong id="backup-status-title">尚未设置备份目录</strong><small id="backup-status-detail">选择一个本地文件夹后，数据变更时会自动写入备份。</small></span>
                </section>

                <div class="settings-list">
                    <label class="setting-row settings-switch-row">
                        <span class="setting-copy"><strong data-i18n="automaticBackup">自动本地备份</strong><small data-i18n="automaticBackupHint">每次数据变化后自动更新最新备份并创建历史快照</small></span>
                        <span class="switch-control">
                            <input id="auto-backup-toggle" type="checkbox">
                            <span></span>
                        </span>
                    </label>

                    <div class="setting-row">
                        <span class="setting-copy"><strong data-i18n="backupDirectory">备份目录</strong><small id="backup-directory-name">尚未选择</small></span>
                        <button class="button button-secondary compact-button" id="choose-backup-directory-button" type="button" data-i18n="chooseFolder">选择目录</button>
                    </div>

                    <label class="setting-row">
                        <span class="setting-copy"><strong data-i18n="historyRetention">历史快照</strong><small data-i18n="historyRetentionHint">自动清理更早的快照，最新备份始终保留</small></span>
                        <select class="settings-select" id="backup-retention-select">
                            <option value="7" data-i18n="keep7Snapshots">保留 7 份</option>
                            <option value="30" data-i18n="keep30Snapshots">保留 30 份</option>
                            <option value="90" data-i18n="keep90Snapshots">保留 90 份</option>
                        </select>
                    </label>

                    <div class="setting-row information-row">
                        <span class="setting-copy"><strong data-i18n="lastBackup">最近备份</strong><small id="last-backup-value">从未备份</small></span>
                    </div>

                    <div class="setting-row">
                        <span class="setting-copy"><strong data-i18n="persistentStorage">浏览器持久存储</strong><small id="persistence-status-value">正在检查…</small></span>
                        <button class="button button-secondary compact-button hidden" id="request-persistence-button" type="button" data-i18n="requestAgain">重新请求</button>
                    </div>
                </div>

                <p class="backup-compatibility" data-i18n="backupCompatibility">自动写入目录需要 Edge 或 Chrome。其他浏览器仍可使用 JSON 手动导出。</p>
            </div>

            <footer class="dialog-footer backup-dialog-footer">
                <button class="button button-danger-quiet hidden" id="disconnect-backup-button" type="button" data-i18n="disconnectBackup">断开备份目录</button>
                <span class="dialog-footer-spacer"></span>
                <button class="button button-secondary" id="backup-dialog-cancel-button" type="button" data-i18n="close">关闭</button>
                <button class="button button-primary" id="backup-now-button" type="button" data-i18n="backupNow">立即备份</button>
            </footer>
        </div>
    </dialog>

    <div class="toast hidden" id="toast" role="status" aria-live="polite">
        <span class="toast-icon"><svg><use href="#icon-check"></use></svg></span><span id="toast-message"></span>
    </div>

    <noscript><div class="noscript-message">这个应用需要启用 JavaScript，但不需要安装 Node.js。 / This app requires JavaScript, but does not require Node.js.</div></noscript>
</body>
</html>
